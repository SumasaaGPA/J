<style>
:root {
  --bg: #070b16; --bg-2: #0b1222; --panel: #0f1930; --panel-2: #142140; --line: #22325a;
  --text: #e8edf8; --muted: #8e9bb8; --accent: #4b5bff; --accent-strong: #3300ee; --red: #e2321f;
  --up: #4ade80; --down: #f87171; --gold: #f5c84b; --silver: #c9d3e3; --bronze: #d98b4f;
  --radius: 10px; --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg);
  background-image: radial-gradient(1200px 500px at 50% -200px, #14225099, transparent); background-repeat: no-repeat;
  color: var(--text); font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  font-size: 15px; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
}
a { color: #9fb0ff; text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.up { color: var(--up); }
.down { color: var(--down); }
[hidden] { display: none !important; }

.site-header { background: #050811; border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand-logo { width: 52px; height: 52px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-title { font-size: 24px; font-weight: 900; letter-spacing: .02em; }
.brand-title b { color: var(--accent); font-family: "Roboto Condensed", sans-serif; margin-left: 2px; }
.brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.brand-sub b { color: var(--red); font-weight: 700; }
.admin-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--red); color: #fff; }
.main-nav { background: var(--bg-2); border-top: 1px solid #ffffff08; }
.nav-inner { display: flex; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 12px 18px; color: var(--muted); font-weight: 700; font-size: 14px; border-bottom: 3px solid transparent; }
.nav-item svg { width: 18px; height: 18px; fill: currentColor; }
.nav-item:hover { color: var(--text); text-decoration: none; background: #ffffff06; }
.nav-item.active { color: #fff; border-bottom-color: var(--accent); }

.main { flex: 1; padding-top: 24px; padding-bottom: 40px; }
.page-title { font-size: 22px; font-weight: 900; margin: 0 0 4px; letter-spacing: .02em; }
.page-title::before { content: ""; display: inline-block; width: 5px; height: 20px; margin-right: 10px; vertical-align: -3px; background: linear-gradient(var(--accent), var(--red)); border-radius: 2px; }
.section-title { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-top: 16px; }
.crumb { margin: 0 0 4px; font-size: 13px; }
.loading { color: var(--muted); padding: 24px; text-align: center; list-style: none; }
.error { color: var(--down); font-size: 13.5px; margin: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.spacer { flex: 1; }
.setup ol { padding-left: 20px; }
.setup li { margin: 6px 0; }
.setup code { background: var(--bg-2); padding: 1px 6px; border-radius: 4px; }

.hero { position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 24px; border-radius: var(--radius); border: 1px solid var(--line); background: linear-gradient(120deg, #101c3d, #0a1124 60%, #1a0d18); }
.hero p { margin: 4px 0 0; }
.hero-watermark { position: absolute; right: -30px; top: -50px; width: 220px; opacity: .06; pointer-events: none; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--up); white-space: nowrap; position: relative; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 0 #4ade8088; animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px #4ade8000; } 100% { box-shadow: 0 0 0 0 #4ade8000; } }

.logo { display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 8px; overflow: hidden; background: #fff; }
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo.noimg { background: linear-gradient(135deg, #1d2c57, #111a33); color: #c3cdf0; font-weight: 900; border: 1px solid var(--line); }

.ranking { list-style: none; margin: 0; padding: 0; }
.rank-head, .rank-row > a { display: grid; grid-template-columns: 72px 56px minmax(0, 1fr) minmax(0, 1.3fr) 128px; align-items: center; gap: 14px; padding: 0 16px; }
.rank-head { font-size: 12px; color: var(--muted); font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.rank-head .r, .rank-rate { text-align: right; }
.rank-row > a { color: var(--text); min-height: 60px; border-bottom: 1px solid #ffffff0c; }
.rank-row > a:hover { background: #ffffff07; text-decoration: none; }
.rank-no { font-family: "Roboto Condensed", sans-serif; font-size: 20px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.rank-logo { width: 40px; height: 40px; font-size: 18px; }
.rank-univ { font-size: 14px; color: #c5cee3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-rate { font-family: "Roboto Condensed", sans-serif; font-size: 22px; font-weight: 700; }
.crown { width: 18px; height: 18px; fill: currentColor; }
.dec { font-size: .62em; opacity: .75; margin-left: 1px; letter-spacing: .01em; }
.rank-row.top > a { --c: var(--accent); position: relative; min-height: 76px; margin: 8px 0; border: 1px solid; border-radius: var(--radius); border-color: color-mix(in srgb, var(--c) 55%, transparent); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), var(--panel-2); box-shadow: 0 0 24px -8px color-mix(in srgb, var(--c) 60%, transparent); }
.rank-row.top > a::before { content: ""; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
.rank-row.top .rank-no { color: var(--c); font-size: 26px; }
.rank-row.top .rank-logo { width: 52px; height: 52px; }
.rank-row.top .rank-name { font-size: 17px; }
.rank-row.top .rank-rate { font-size: 28px; color: #fff; }
.rank-row.top1 > a { --c: var(--gold); min-height: 88px; }
.rank-row.top1 .rank-rate { font-size: 32px; color: var(--gold); }
.rank-row.top2 > a { --c: var(--silver); }
.rank-row.top3 > a { --c: var(--bronze); }
.rank-row.top5 > a { margin-bottom: 18px; }

.search { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 48px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 20px; height: 20px; fill: var(--muted); flex: none; }
.search input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; font-size: 16px; outline: none; height: auto; padding: 0; box-shadow: none !important; }
.circle-grid { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.circle-card { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); }
.circle-card:hover { border-color: var(--accent); text-decoration: none; }
.card-logo { width: 48px; height: 48px; font-size: 20px; }
.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.card-univ { font-size: 12.5px; color: var(--muted); }
.card-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-rate { text-align: right; font-family: "Roboto Condensed", sans-serif; font-size: 20px; font-weight: 700; line-height: 1.1; }
.card-rate small:first-child { display: block; font-family: "Noto Sans JP", sans-serif; font-size: 11px; color: var(--muted); font-weight: 500; }

.profile { display: flex; gap: 20px; align-items: center; }
.profile-logo { width: 112px; height: 112px; font-size: 44px; border-radius: 14px; }
.profile-body { flex: 1; min-width: 0; }
.profile-univ { color: var(--muted); font-size: 14px; }
.profile-name { font-size: 24px; font-weight: 900; margin: 0 0 10px; line-height: 1.3; }
.profile-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.profile-stats small { display: block; font-size: 12px; color: var(--muted); }
.profile-stats strong { font-family: "Roboto Condensed", sans-serif; font-size: 22px; }
.profile-stats strong.big { font-size: 34px; color: #fff; line-height: 1.1; }
.profile-stats strong small.dec { display: inline; font-size: .62em; color: inherit; }
.history { list-style: none; margin: 0; padding: 0; }
.history li { display: grid; grid-template-columns: 36px minmax(0, 1fr) 64px 80px 130px; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid #ffffff0c; }
.res { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; font-weight: 900; font-size: 12px; background: #2a3658; color: #c8d2ee; white-space: nowrap; }
.res-win { background: #1d6b45; color: #d7ffe8; font-size: 15px; }
.res-lose { background: #7a2430; color: #ffdfe2; font-size: 15px; }
.res-bonus { background: #7a5a12; color: #ffefc2; }
.res-normalize { background: #3a2f6e; color: #e2dcff; }
.h-main { min-width: 0; overflow-wrap: anywhere; }
.h-reason { display: block; font-size: 12.5px; color: var(--muted); }
.h-delta { font-family: "Roboto Condensed", sans-serif; font-weight: 700; font-size: 18px; text-align: right; }
.h-after { text-align: right; color: #c5cee3; font-family: "Roboto Condensed", sans-serif; }
.h-date { text-align: right; color: var(--muted); font-size: 12.5px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #24335e; color: #c8d2ee; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
.tag-t { background: #5a1c22; color: #ffcfd3; }

.form .field { margin-bottom: 18px; }
.form label, .form .label { display: block; font-size: 13px; font-weight: 700; color: #c5cee3; margin-bottom: 6px; }
.narrow { max-width: 420px; margin-left: auto; margin-right: auto; }
input, select, textarea { width: 100%; height: 46px; padding: 0 12px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; outline: none; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #4b5bff33; }
input[type=checkbox], input[type=radio] { width: auto; height: auto; }
.filter { height: 40px; font-size: 14px; margin: 4px 0 10px; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
.versus .vs { font-family: "Roboto Condensed", sans-serif; font-weight: 700; font-size: 22px; color: var(--red); padding-bottom: 28px; }
.winner-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.winner-pick button { min-height: 60px; padding: 8px 12px; font: inherit; font-weight: 700; color: var(--text); cursor: pointer; background: var(--bg-2); border: 2px solid var(--line); border-radius: var(--radius); }
.winner-pick button:disabled { color: var(--muted); cursor: default; }
.winner-pick button:not(:disabled):hover { border-color: var(--accent); }
.winner-pick button.on { border-color: var(--gold); background: #3a2f0f; color: var(--gold); }
.winner-pick button.on::before { content: "WIN  "; font-family: "Roboto Condensed", sans-serif; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { margin: 0; cursor: pointer; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); font-weight: 700; }
.seg input:checked + span { background: var(--accent-strong); border-color: var(--accent); color: #fff; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.preview, .norm-preview { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; }
.norm-preview:empty { display: none; }
.preview p, .norm-preview p { margin: 4px 0 0; }
.pv-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.pv-row > span:nth-child(2) { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.norm-preview .pv-row > span:first-child { flex: 1; font-weight: 700; }
.pv-rate { color: #c5cee3; font-family: "Roboto Condensed", sans-serif; white-space: nowrap; }
.formula { background: var(--bg-2); padding: 12px 14px; border-radius: 8px; font-weight: 700; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; font: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; color: var(--text); background: #1b2848; border: 1px solid var(--line); border-radius: 8px; }
.btn:hover { background: #22325a; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent-strong); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #4419ff; }
.btn.danger { background: #5c1820; border-color: #8a2a35; color: #ffd9dd; }
.btn.danger:hover { background: #74202a; }
.btn.block { width: 100%; height: 50px; font-size: 16px; }
.small-btn { height: 34px; padding: 0 12px; font-size: 13px; }
label.btn { margin: 0 6px 6px 0; color: var(--text); }
.login-logo { display: block; width: 96px; margin: 0 auto 8px; }

.tabs { display: flex; gap: 6px; overflow-x: auto; margin-top: 16px; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 38px; padding: 0 14px; border-radius: 99px; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 700; background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.tab.active { background: var(--accent-strong); color: #fff; border-color: var(--accent); }
.tab-panel .panel:first-child { margin-top: 16px; }
#tab-password .btn.block:last-child { margin-top: 16px; }
.admin-list { list-style: none; margin: 0; padding: 0; }
.admin-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #ffffff0c; }
.mini-logo { width: 36px; height: 36px; font-size: 15px; }
.al-main { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.al-main small { display: block; color: var(--muted); font-size: 12px; }
.al-rate { font-family: "Roboto Condensed", sans-serif; font-weight: 700; font-size: 18px; }
.check-list { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-2); }
.check-list .check { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 0; font-weight: 500; cursor: pointer; border-bottom: 1px solid #ffffff08; }
.check-list .check:hover { background: #ffffff06; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

.dialog { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 22px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.dialog::backdrop { background: #000a; }
.dialog h2 { margin: 0 0 16px; font-size: 18px; }
.confirm-msg { white-space: pre-line; margin: 0; overflow-wrap: anywhere; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.logo-edit { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
.logo-preview { width: 96px; height: 96px; border-radius: 10px; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--bg-2); border: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
.logo-preview img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
.logo-edit p { margin: 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 10px; z-index: 100; background: #1d6b45; color: #fff; font-weight: 700; box-shadow: 0 8px 24px #0008; transition: .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #8a2a35; }

.site-footer { background: #04060d; border-top: 1px solid var(--line); padding: 28px 0; font-size: 13px; color: var(--muted); }
.site-footer p { margin: 4px 0; overflow-wrap: anywhere; }
.footer-logo { width: 40px; opacity: .5; margin-bottom: 6px; }

/* ================================================================ スマートフォン表示 */
@media (max-width: 760px) {
  body { font-size: 14.5px; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
  .header-inner { height: 58px; }
  .brand { gap: 10px; }
  .brand-logo { width: 40px; height: 40px; }
  .brand-title { font-size: 19px; }
  .brand-sub { font-size: 10px; letter-spacing: 0; }
  .main-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; border-top: 1px solid var(--line); background: #050811f2; backdrop-filter: blur(10px); padding-bottom: env(safe-area-inset-bottom); }
  .nav-inner { padding: 0; gap: 0; }
  .nav-item { flex: 1; flex-direction: column; gap: 2px; height: var(--nav-h); padding: 8px 2px 6px; justify-content: center; font-size: 10.5px; border-bottom: 0; border-top: 3px solid transparent; }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-item.active { border-top-color: var(--accent); background: #4b5bff14; }
  .main { padding-top: 16px; }
  .page-title { font-size: 19px; }
  .panel { padding: 14px; }
  .hero { padding: 16px; flex-direction: column; align-items: flex-start; gap: 8px; }
  .hero p { font-size: 13px; }
  .rank-head { display: none; }
  .ranking { margin: -4px -6px; }
  .rank-row > a { grid-template-columns: 34px 40px minmax(0, 1fr) auto; grid-template-areas: "no logo univ rate" "no logo name rate"; gap: 0 10px; padding: 10px 8px; min-height: 0; }
  .rank-no { grid-area: no; font-size: 17px; justify-content: center; flex-direction: column; gap: 0; }
  .rank-logo { grid-area: logo; width: 40px; height: 40px; }
  .rank-univ { grid-area: univ; font-size: 11.5px; color: var(--muted); align-self: end; }
  .rank-name { grid-area: name; font-size: 14.5px; align-self: start; }
  .rank-rate { grid-area: rate; font-size: 20px; }
  .rank-row.top > a { min-height: 0; margin: 6px 0; padding: 12px 10px; grid-template-columns: 34px 46px minmax(0, 1fr) auto; }
  .rank-row.top .rank-no { font-size: 21px; }
  .rank-row.top .rank-logo { width: 46px; height: 46px; }
  .rank-row.top .rank-name { font-size: 15px; }
  .rank-row.top .rank-rate { font-size: 23px; }
  .rank-row.top1 > a { min-height: 0; padding: 16px 10px; }
  .rank-row.top1 .rank-rate { font-size: 26px; }
  .crown { width: 15px; height: 15px; }
  .circle-grid { grid-template-columns: 1fr; }
  .profile { flex-direction: column; text-align: center; gap: 12px; }
  .profile-logo { width: 96px; height: 96px; }
  .profile-name { font-size: 20px; }
  .profile-stats { justify-content: center; gap: 22px; }
  .history li { grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "res main delta" "res date after"; gap: 2px 10px; padding: 10px 0; }
  .history .res { grid-area: res; }
  .h-main { grid-area: main; }
  .h-delta { grid-area: delta; }
  .h-after { grid-area: after; font-size: 12.5px; }
  .h-after::before { content: "→ "; color: var(--muted); }
  .h-date { grid-area: date; text-align: left; font-size: 11.5px; }
  .versus { grid-template-columns: 1fr; gap: 0; }
  .versus .vs { padding: 0 0 10px; text-align: center; font-size: 18px; }
  .seg { display: grid; grid-template-columns: 1fr; }
  .seg span { display: block; text-align: center; }
  .toast { bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); }
  .site-footer { padding: 20px 0; font-size: 12px; }
}
</style>

// ================================================================ ユーティリティ
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 検索用の正規化（全角英数→半角、カタカナ→ひらがな、小文字化）
function normalize(s) {
  return String(s ?? '').normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, '');
}
function roundHalfUp(x) { return Math.sign(x) * Math.floor(Math.abs(x) + 0.5); }
// レートは内部値を小数第 2 位まで表示する（変動額は自然数表記）
function fmtRate(x) { return Number(x).toFixed(2); }
function rateHtml(x) { const [i, f] = fmtRate(x).split('.'); return `${i}<small class="dec">.${f}</small>`; }
function fmtDelta(d) { return d > 0 ? `+${d}` : d < 0 ? `−${-d}` : '±0'; }
function fmtDate(s) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date(s)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
}
const kanaOf = c => c.university_kana || c.university;
const byKana = (a, b) => kanaOf(a).localeCompare(kanaOf(b), 'ja');
const matches = (c, term) => !term || [c.name, c.university, c.university_kana].some(s => normalize(s).includes(term));

function logoHtml(c, cls) {

  return `<span class="logo noimg ${cls}" aria-hidden="true">${esc([...(c.name || '?')][0])}</span>`;
}
let toastTimer;
function toast(msg, isError) {

  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
}
// ページ内の確認ダイアログ（window.confirm はアプリ内ブラウザ等で無効化されることがあるため使わない）
function confirmDialog(message, okLabel = '実行する', danger = false) {
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');
    dlg.className = 'dialog';
    dlg.innerHTML = `<h2>確認</h2><p class="confirm-msg"></p><div class="dialog-actions">
      <button type="button" class="btn" data-v="0">キャンセル</button>
      <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-v="1"></button></div>`;
    dlg.querySelector('.confirm-msg').textContent = message;
    dlg.querySelector('[data-v="1"]').textContent = okLabel;
    let result = false;
    dlg.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { result = b.dataset.v === '1'; dlg.close(); } });
    dlg.addEventListener('close', () => { dlg.remove(); resolve(result); });
    document.body.appendChild(dlg);
    dlg.showModal();
  });
}
// 画像ファイルを中央で正方形に切り抜く（WebP 非対応ブラウザでは PNG になる）
function squareImage(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/webp', 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

// ================================================================ Supabase 通信
const configured = /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;
function headers(json) {
  const h = { apikey: SUPABASE_KEY };
  if (SUPABASE_KEY.startsWith('eyJ')) h.Authorization = `Bearer ${SUPABASE_KEY}`;  // 旧形式 (JWT) の anon key
  if (json) h['Content-Type'] = 'application/json';
  return h;
}
async function handle(res) {
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && (data.message || data.error)) || `通信エラー（${res.status}）`);
  if (data && typeof data === 'object' && !Array.isArray(data) && data.error) throw new Error(data.error);
  return data;
}
async function rest(path) {
  return handle(await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: headers(false) }));
}
async function rpc(fn, args = {}) {
  return handle(await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: headers(true), body: JSON.stringify(args) }));
}

// ロゴは容量が大きいので、変更があったサークル分だけ取得してキャッシュする
const logoCache = new Map();
async function fetchRanking() {
  const rows = await rest('circles?select=id,name,university,university_kana,rating,logo_ver');
  const need = rows.filter(r => r.logo_ver > 0 && (logoCache.get(r.id) || {}).ver !== r.logo_ver).map(r => r.id);
  if (need.length) {
    const ls = await rest(`circles?select=id,logo,logo_ver&id=in.(${need.join(',')})`);
    ls.forEach(l => logoCache.set(l.id, { ver: l.logo_ver, logo: l.logo }));
  }
  const list = rows.map(r => ({ ...r, rating_exact: r.rating, logo: r.logo_ver > 0 ? (logoCache.get(r.id) || {}).logo || null : null }));
  // 内部レート降順 → 同値なら大学名の読みの五十音順
  list.sort((a, b) => b.rating - a.rating || byKana(a, b) || a.id - b.id);
  let prev = null, rank = 0;
  list.forEach((c, i) => { if (c.rating !== prev) { rank = i + 1; prev = c.rating; } c.rank = rank; });
  return list;
}

  adminToken = token;

async function adminRpc(fn, args = {}) {
  try {
    return await rpc(fn, { p_token: adminToken, ...args });
  } catch (e) {
    if (/管理者ログインが必要/.test(e.message)) { setAdmin(null); route(); }
    throw e;
  }
}

  const path = location.hash.replace(/^#/, '') || '/';
  const hit = routes.find(([re]) => re.test(path));
  const [re, nav, fn] = hit || routes[0];
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === nav));

  fn(path.match(re).slice(1), () => my === seq);

        <li class="rank-row${i < 5 ? ' top top' + (i + 1) : ''}"><a href="#/circles/${c.id}">

        </a></li>`).join('') || '<li class="loading">サークルが登録されていません</li>';

    } catch (e) {
      if (alive() && $('ranking').querySelector('.loading')) $('ranking').innerHTML = `<li class="loading error">${esc(e.message)}</li>`;
    }
  }
  refresher = load;
  load();
}

// ================================================================ サークル詳細
async function viewCircle([id], alive) {
  view.innerHTML = `<p class="crumb"><a href="#/circles">← サークル検索</a></p>
    <section class="panel profile" id="profile"><p class="loading">読み込み中…</p></section>
    <section class="panel"><h2 class="section-title">レート変動履歴</h2><div id="history"></div></section>`;
  const KIND = { match: '対戦', simple: '過去試合', bonus: 'ボーナス', adjust: '管理者調整', normalize: 'レート均一化' };
  try {
    const [list, hist] = await Promise.all([fetchRanking(), rest(`history?circle_id=eq.${Number(id)}&order=id.desc`)]);
    if (!alive()) return;
    const c = list.find(x => x.id === Number(id));
    if (!c) { $('profile').innerHTML = '<p class="error">サークルが見つかりません</p>'; return; }
    document.title = `${c.name} | スマサーGPA`;
    const wins = hist.filter(h => h.result === 'win').length, losses = hist.filter(h => h.result === 'lose').length;
    $('profile').innerHTML = `${logoHtml(c, 'profile-logo')}
      <div class="profile-body">
        <div class="profile-univ">${esc(c.university)}</div>
        <h1 class="profile-name">${esc(c.name)}</h1>
        <div class="profile-stats">
          <div><small>レート</small><strong class="big">${rateHtml(c.rating_exact)}</strong></div>
          <div><small>順位</small><strong>${c.rank}<span class="muted"> / ${list.length}</span></strong></div>
          <div><small>戦績</small><strong>${wins}勝 ${losses}敗</strong></div>
        </div>
      </div>`;
    if (!hist.length) { $('history').innerHTML = '<p class="muted">まだ履歴はありません。</p>'; return; }
    $('history').innerHTML = `<ul class="history">${hist.map(r => {
      const d = roundHalfUp(r.delta);
      let main;
      if (r.result) {
        const opp = r.opponent_id ? `<a href="#/circles/${r.opponent_id}">${esc(r.opponent_name)}</a>` : esc(r.opponent_name || '（削除済み）');
        const tags = [];
        if (r.kind === 'match' && r.weight > 1) tags.push('<span class="tag tag-t">トーナメント</span>');
        if (r.kind === 'simple') tags.push('<span class="tag">過去試合</span>');
        main = `<span class="res res-${r.result}">${r.result === 'win' ? '勝' : '負'}</span>
          <span class="h-main">vs ${opp} ${tags.join('')}${r.reason ? `<span class="h-reason">${esc(r.reason)}</span>` : ''}</span>`;
      } else {
        main = `<span class="res res-${esc(r.kind)}">${(KIND[r.kind] || '').slice(0, 2)}</span><span class="h-main">${esc(r.reason || KIND[r.kind])}</span>`;
      }
      return `<li>${main}<span class="h-delta ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${fmtDelta(d)}</span>
        <span class="h-after">${fmtRate(r.rating_after)}</span><span class="h-date">${fmtDate(r.created_at)}</span></li>`;
    }).join('')}</ul>`;
  } catch (e) { if (alive()) failView(e); }
}

function viewMatch(_, alive) {
  document.title = '勝敗登録 | スマサーGPA';
  view.innerHTML = `<h1 class="page-title">勝敗登録</h1>
  <form id="form" class="panel form" autocomplete="off">
    <div class="field"><label for="pw">登録パスワード</label>

    <div class="versus">

      <span class="vs">VS</span>
      <div class="field"><label for="b">サークル 2</label><select id="b" required></select></div>
    </div>
    <div class="field"><span class="label">勝者</span>
      <div class="winner-pick" id="winnerPick">
        <button type="button" data-side="a" disabled>サークル 1 を選択</button>
        <button type="button" data-side="b" disabled>サークル 2 を選択</button>
      </div></div>
    <div class="field"><span class="label">試合の種類</span>
      <div class="seg">
        <label><input type="radio" name="weight" value="normal" checked><span>通常試合</span></label>
        <label><input type="radio" name="weight" value="tournament"><span>トーナメント試合（×${TOURNAMENT_WEIGHT}）</span></label>
      </div></div>
    <div id="preview" class="preview" hidden></div>
    <p id="msg" class="error" hidden></p>
    <button class="btn primary block" id="submit" type="submit" disabled>登録する</button>
  </form>
  <dialog id="confirm" class="dialog"><h2>この内容で登録しますか？</h2><div id="confirmBody"></div>
    <div class="dialog-actions"><button class="btn" type="button" id="cancel">戻る</button><button class="btn primary" type="button" id="ok">登録する</button></div></dialog>`;
  let circles = {}, winner = null;
  const sides = () => ({ a: circles[$('a').value], b: circles[$('b').value] });
  const weight = () => document.querySelector('input[name=weight]:checked').value;
  function fill(list) {
    list.forEach(c => circles[c.id] = c);
    const opts = list.slice().sort(byKana).map(c => `<option value="${c.id}">${esc(c.university)} / ${esc(c.name)}</option>`).join('');
    $('a').innerHTML = $('b').innerHTML = '<option value="">選択してください</option>' + opts;
  }
  function previewHtml() {
    const { a, b } = sides();
    const [w, l] = winner === 'a' ? [a, b] : [b, a];
    const k = 32 * (weight() === 'tournament' ? TOURNAMENT_WEIGHT : 1);
    const ew = 1 / (1 + 10 ** ((l.rating_exact - w.rating_exact) / 400));
    const gain = k * (1 - ew), loss = -gain;
    return `<div class="pv-row"><span class="res res-win">勝</span><span>${esc(w.name)}</span><span class="pv-rate">${fmtRate(w.rating_exact)} → ${fmtRate(w.rating_exact + gain)}</span><span class="h-delta up">${fmtDelta(roundHalfUp(gain))}</span></div>
      <div class="pv-row"><span class="res res-lose">負</span><span>${esc(l.name)}</span><span class="pv-rate">${fmtRate(l.rating_exact)} → ${fmtRate(l.rating_exact + loss)}</span><span class="h-delta down">${fmtDelta(roundHalfUp(loss))}</span></div>
      <p class="muted small">${weight() === 'tournament' ? `トーナメント試合（変動 ×${TOURNAMENT_WEIGHT}）` : '通常試合'}・予想変動値</p>`;
  }
  function update() {
    const { a, b } = sides();
    const btns = $('winnerPick').querySelectorAll('button');
    [a, b].forEach((c, i) => {
      btns[i].disabled = !c || !a || !b || a.id === b.id;
      btns[i].textContent = c ? c.name : `サークル ${i + 1} を選択`;
      btns[i].classList.toggle('on', !!c && winner === btns[i].dataset.side);
    });
    const same = a && b && a.id === b.id;
    $('msg').hidden = !same;
    $('msg').textContent = same ? '同じサークル同士は登録できません' : '';
    const ready = a && b && !same && winner;
    $('submit').disabled = !ready;
    $('preview').hidden = !ready;
    if (ready) $('preview').innerHTML = previewHtml();
  }
  ['a', 'b'].forEach(id => $(id).addEventListener('change', () => { winner = null; update(); }));
  document.querySelectorAll('input[name=weight]').forEach(r => r.addEventListener('change', update));
  $('winnerPick').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) { winner = b.dataset.side; update(); } });
  $('form').addEventListener('submit', e => { e.preventDefault(); $('confirmBody').innerHTML = previewHtml(); $('confirm').showModal(); });
  $('cancel').onclick = () => $('confirm').close();
  $('ok').onclick = async () => {
    const { a, b } = sides();
    const [w, l] = winner === 'a' ? [a, b] : [b, a];
    $('ok').disabled = true;
    try {
      const r = await rpc('submit_match', { p_password: $('pw').value, p_winner: w.id, p_loser: l.id, p_tournament: weight() === 'tournament' });
      $('pw').value = '';
      $('confirm').close();
      toast(`登録しました：${r.winner.name} ${fmtDelta(roundHalfUp(r.winner.delta))} / ${r.loser.name} ${fmtDelta(roundHalfUp(r.loser.delta))}`);
      circles = {};
      fill(await fetchRanking());
      winner = null;
      update();
    } catch (err) {
      $('confirm').close();
      $('msg').hidden = false;
      $('msg').textContent = err.message;
    } finally { $('ok').disabled = false; }
  };
  fetchRanking().then(list => { if (alive()) fill(list); }).catch(failView);
}

  const bonusChecked = new Set();
  function renderBonusList() {
    const term = normalize($('bonusFilter').value);
    $('bonusList').innerHTML = circles.filter(c => matches(c, term)).map(c => `
      <label class="check"><input type="checkbox" value="${c.id}" ${bonusChecked.has(c.id) ? 'checked' : ''}><span>${esc(c.university)} / ${esc(c.name)}</span></label>`).join('');
    $('bonusCount').textContent = bonusChecked.size ? `${bonusChecked.size} 件選択中` : '';
  }
  $('bonusFilter').addEventListener('input', renderBonusList);
  $('bonusList').addEventListener('change', e => {
    const id = Number(e.target.value);
    e.target.checked ? bonusChecked.add(id) : bonusChecked.delete(id);
    $('bonusCount').textContent = bonusChecked.size ? `${bonusChecked.size} 件選択中` : '';
  });
  $('tab-bonus').addEventListener('submit', async e => {
    e.preventDefault();
    if (!bonusChecked.size) return toast('対象サークルを選択してください', true);
    const type = document.querySelector('input[name=btype]:checked').value;
    const label = type === 'qualify' ? '予選抜けボーナス +40' : '優勝ボーナス +30';
    const names = circles.filter(c => bonusChecked.has(c.id)).map(c => c.name).join('、');
    if (!await confirmDialog(`${label} を付与します。\n対象：${names}\n理由：${$('bonusReason').value}`, '付与する')) return;
    try {
      const r = await adminRpc('admin_bonus', { p_type: type, p_reason: $('bonusReason').value, p_ids: [...bonusChecked] });
      toast(`${r.count} サークルに +${r.amount} を付与しました`);
      bonusChecked.clear(); $('bonusReason').value = ''; reload();
    } catch (err) { toast(err.message, true); }
  });

  // ---- 手動調整
  $('tab-adjust').addEventListener('submit', async e => {
    e.preventDefault();
    const c = find($('adjCircle').value), amt = parseInt($('adjAmount').value, 10);
    if (!c) return toast('サークルを選択してください', true);
    if (!amt) return toast('変動量を整数で入力してください', true);
    if (!await confirmDialog(`${c.name} のレートを ${fmtDelta(amt)} します。\n（${fmtRate(c.rating_exact)} → ${fmtRate(c.rating_exact + amt)}）`, '調整する')) return;
    try {
      await adminRpc('admin_adjust', { p_id: c.id, p_amount: amt, p_reason: $('adjReason').value });
      toast('調整しました'); $('adjAmount').value = ''; $('adjReason').value = ''; reload();
    } catch (err) { toast(err.message, true); }
  });

  // ---- 過去試合
  $('tab-simple').addEventListener('submit', async e => {
    e.preventDefault();
    const w = find($('simW').value), l = find($('simL').value);
    if (!w || !l) return toast('勝者と敗者を選択してください', true);
    if (w.id === l.id) return toast('同じサークル同士は登録できません', true);
    if (!await confirmDialog(`勝者：${w.name}（+16）\n敗者：${l.name}（−16）\nで反映します。`, '反映する')) return;
    try {
      await adminRpc('admin_simple', { p_winner: w.id, p_loser: l.id, p_reason: $('simReason').value });
      toast('反映しました'); $('simW').value = $('simL').value = ''; $('simReason').value = ''; reload();
    } catch (err) { toast(err.message, true); }
  });

  // ---- 均一化
  function renderNormPreview() {
    const x = parseFloat($('normX').value);
    if (!(x > 0)) { $('normPreview').innerHTML = ''; return; }
    const top = circles.slice().sort((a, b) => b.rating_exact - a.rating_exact);
    const sample = top.slice(0, 3).concat(top.length > 3 ? top.slice(-2) : []);
    $('normPreview').innerHTML = '<p class="muted small">変更後の例</p>' + sample.map(c =>
      `<div class="pv-row"><span>${esc(c.name)}</span><span class="pv-rate">${fmtRate(c.rating_exact)} → ${fmtRate((c.rating_exact - BASE_RATING) / x + BASE_RATING)}</span></div>`).join('');
  }
  $('normX').addEventListener('input', renderNormPreview);
  $('tab-normalize').addEventListener('submit', async e => {
    e.preventDefault();
    if (!await confirmDialog(`X = ${$('normX').value} で全サークルのレートを均一化します。よろしいですか？`, '均一化する', true)) return;
    try { await adminRpc('admin_normalize', { p_x: parseFloat($('normX').value) }); toast('均一化しました'); $('normX').value = ''; reload(); }
    catch (err) { toast(err.message, true); }
  });

  // ---- 登録履歴
  const KIND = { match: '対戦', simple: '過去試合', bonus: 'ボーナス', adjust: '手動調整', normalize: '均一化' };
  async function loadEvents() {
    try {
      const events = await adminRpc('admin_events');
      if (!alive()) return;
      $('events').innerHTML = events.map(ev => {
        let desc;
        const items = ev.items.map(i => ({ ...i, delta: roundHalfUp(i.delta) }));
        if (ev.kind === 'match' || ev.kind === 'simple') {
          const w = items.find(i => i.result === 'win'), l = items.find(i => i.result === 'lose');
          desc = `${esc(w.circle)} <b class="up">${fmtDelta(w.delta)}</b> vs ${esc(l.circle)} <b class="down">${fmtDelta(l.delta)}</b>${ev.weight > 1 ? ' <span class="tag tag-t">トーナメント</span>' : ''}`;
        } else if (ev.kind === 'normalize') {
          desc = `${esc(ev.reason)}（${items.length} サークル）`;
        } else {
          desc = `${esc(ev.reason)}：${items.map(i => `${esc(i.circle)} <b class="${i.delta > 0 ? 'up' : 'down'}">${fmtDelta(i.delta)}</b>`).join('、')}`;
        }
        return `<li><span class="tag">${KIND[ev.kind] || ''}</span><span class="al-main"><small>${esc(ev.created_at)}</small>${desc}</span>
          <button class="btn small-btn danger" data-undo="${esc(ev.id)}" data-kind="${esc(ev.kind)}">取り消し</button></li>`;
      }).join('') || '<li class="muted">履歴はありません</li>';
    } catch (err) { toast(err.message, true); }
  }
  $('events').addEventListener('click', async e => {
    const b = e.target.closest('[data-undo]');
    if (!b) return;
    const msg = b.dataset.kind === 'normalize'
      ? 'このレート均一化を取り消しますか？\n全サークルのレートが均一化前の値（小数を含む）に戻ります。\n均一化の後に登録した試合などの変動分はそのまま残ります。'
      : 'この登録を取り消しますか？\n変動分が現在のレートから差し戻されます。';
    if (!await confirmDialog(msg, '取り消す', true)) return;
    try { await adminRpc('admin_undo', { p_event: b.dataset.undo }); toast('取り消しました'); loadEvents(); reload(); }
    catch (err) { toast(err.message, true); }
  });

  // ---- パスワード
  $('tab-entrypw').addEventListener('submit', async e => {
    e.preventDefault();
    if ($('pwEntryNew').value !== $('pwEntryNew2').value) return toast('確認用パスワードが一致しません', true);
    try { await adminRpc('admin_change_password', { p_kind: 'entry', p_current: null, p_new: $('pwEntryNew').value }); toast('勝敗登録パスワードを変更しました'); e.target.reset(); }
    catch (err) { toast(err.message, true); }
  });
  $('pwAdmin').addEventListener('submit', async e => {
    e.preventDefault();
    if ($('pwNew').value !== $('pwNew2').value) return toast('確認用パスワードが一致しません', true);
    try { await adminRpc('admin_change_password', { p_kind: 'admin', p_current: $('pwCur').value, p_new: $('pwNew').value }); toast('管理者パスワードを変更しました'); e.target.reset(); }
    catch (err) { toast(err.message, true); }
  });
  $('logout').onclick = async () => {
    try { await rpc('admin_logout', { p_token: adminToken }); } catch (e) {}
    setAdmin(null);
    route();
  };

  reload().catch(failView);
}

    <button class="btn primary block">ログイン</button>
    <p class="muted small center">ログイン状態は 1 週間維持されます。</p>
  </form>`;
  $('login').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const r = await rpc('admin_login', { p_password: $('loginPw').value });
      setAdmin(r.token);
      if (alive()) route();
    } catch (err) { $('loginMsg').hidden = false; $('loginMsg').textContent = err.message; }
  });
}

// ================================================================ 起動
$('adminBadge').hidden = !adminToken;
if (configured && adminToken) rpc('admin_check', { p_token: adminToken }).then(ok => { if (!ok) setAdmin(null); }).catch(() => {});
route();
</script>
</body>
</html>
